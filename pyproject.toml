[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rdk-expansion"
version = "0.1.0"
description = "RDK 40Pin expansion board support package for Raspberry Pi 4"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pigpio>=1.78",
  "pyserial>=3.5",
  "PyYAML>=6.0",
  "smbus2>=0.4.3",
  "spidev>=3.6",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
rdk-expansion = "rdk_expansion.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

